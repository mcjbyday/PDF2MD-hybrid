[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PDF2MD-hybrid"
version = "0.1.1"
description = "Turn born-digital PDFs into grounded Markdown with a local vision model, without sending every page through it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michael Jacobs" }]
requires-python = ">=3.9"
keywords = ["pdf", "markdown", "rag", "retrieval", "ollama", "local-llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# Permissive licenses only, and deliberately just two. Everything else is the
# standard library: HTTP goes through urllib rather than adding `requests`.
# Do not add PyMuPDF (AGPL) or Poppler/pdf2image (GPL) -- a copyleft dependency
# propagates to anything that links this.
dependencies = [
    "pdfplumber>=0.11",   # MIT. Text, per-character font, size and position.
    "pypdfium2>=5.0",     # Apache-2.0 / BSD-3. Page rasterization.
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdf2md = "pdf2md_hybrid.pipeline:main"
pdf2md-probe = "pdf2md_hybrid.probe:main"
pdf2md-extract = "pdf2md_hybrid.extract:main"
pdf2md-enrich = "pdf2md_hybrid.enrich:main"
pdf2md-assemble = "pdf2md_hybrid.assemble:main"
pdf2md-index = "pdf2md_hybrid.index:main"

[project.urls]
Homepage = "https://github.com/mcjbyday/PDF2MD-hybrid"

[tool.setuptools]
# A real package, not top-level modules. Names like `index`, `common` and
# `layout` installed at top level would collide with a consuming project's own
# modules, and an omission from a py-modules list is invisible until someone
# installs the wheel.
packages = ["pdf2md_hybrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
